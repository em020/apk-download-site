# Add inside YOUR existing HTTPS server {} on the gateway Nginx.
# Replace the upstream documentation address with the private origin.
# If the gateway is on the public Internet, use your existing private tunnel/VPN
# and replace this upstream with its endpoint. A private LAN IP is not Internet-routable.
location = /android {
    return 301 /android/;
}
location /android/ {
    # Trailing slash strips /android/ when proxying to the origin.
    proxy_pass http://192.0.2.52:8098/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_cache off;
    proxy_redirect off;
    # For an invited internal test, enable access control at this gateway:
    # auth_basic "APK download site";
    # auth_basic_user_file /etc/nginx/apk-download-site.htpasswd;
}
